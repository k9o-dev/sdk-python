[project]
name = "k9o"
version = "1.4.0"
description = "Kilimanjaro platform SDK — createClient + data DSL + projects + gate + migrations + functions + policies + audit + orgs + me + org + studio (workflows/dashboards) + compute.llms + realtime subscriptions + kibo (ZK vault) + barbican (Keep L2 guardrail) + KError. Full TS-surface parity. Python idiomatic (snake_case; raise KError; async for streams)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Kilimanjaro", email = "engineering@kilimanjaro.dev" }
]
requires-python = ">=3.10"
keywords = ["kilimanjaro", "k9o", "sdk", "platform"]

dependencies = [
    "httpx>=0.27.0",
    # `NotRequired` (used by the migrations control-plane TypedDicts) is stdlib
    # only from 3.11; on the declared 3.10 floor it falls back to this package.
    "typing_extensions>=4.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",  # httpx mocking
]

[project.urls]
homepage = "https://kilimanjaro.dev"
documentation = "https://docs.kilimanjaro.dev"
repository = "https://github.com/k9o-dev/sdk-python"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["k9o*"]
exclude = ["tests*"]

# Ship the bound-core native lib + generated uniffi binding inside the wheel.
# These are CI-injected into k9o/{kibo,barbican}/_ffi/ from the respective
# artifact bundle (one platform's lib per platform wheel) and gitignored
# in-repo; the publish pipeline builds one wheel per platform tag. On a
# platform with no matching wheel, pip falls back to the sdist and the
# affected submodule is simply unavailable.
[tool.setuptools.package-data]
"k9o.kibo._ffi" = ["*.so", "*.dylib", "*.pyd"]
"k9o.barbican._ffi" = ["*.so", "*.dylib", "*.pyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
